{% extends "base.html" %}

{% block title %}
Login - ShopEasy
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to your ShopEasy account.
        </p>


        <form method="POST">

            {% csrf_token %}

            {% if form.errors %}

                <div class="form-errors">
                    Username or password is incorrect.
                </div>

            {% endif %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="checkout-btn"
            >
                Login
            </button>

        </form>


        <p class="auth-footer">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
